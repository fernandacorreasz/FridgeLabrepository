server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
  location = /api { proxy_pass http://backend:8080; proxy_set_header Host $host; }
  location = /swagger-ui.html { proxy_pass http://backend:8080; proxy_set_header Host $host; }
  location /swagger-ui/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
  location = /v3/api-docs { proxy_pass http://backend:8080; proxy_set_header Host $host; }
  location /v3/api-docs/ { proxy_pass http://backend:8080; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
